<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rumbo Viajes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plane" viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  </svg>

  <header class="barra">
    <div class="marca">
      <svg class="icono logo"><use href="#i-plane"/></svg>
      <div>
        <h1>Rumbo Viajes</h1>
        <p class="sub">Paquetes turísticos y reservas</p>
      </div>
    </div>
    <dl class="stats">
      <div><dt>Paquetes</dt><dd id="stat-paquetes">–</dd></div>
      <div><dt>Cupos libres</dt><dd id="stat-cupos">–</dd></div>
      <div><dt id="stat-reservas-txt">Reservas</dt><dd id="stat-reservas">–</dd></div>
      <div><dt>Vendido</dt><dd id="stat-ventas">–</dd></div>
    </dl>
  </header>

  <main>
    <div class="columnas">
    <section class="panel panel-form" aria-labelledby="form-titulo">
      <div class="panel-cabecera">
        <h2 id="form-titulo">Nuevo paquete</h2>
        <button type="button" id="btn-cancelar" class="enlace" hidden>Cancelar edición</button>
      </div>
      <form id="form-paquete" novalidate>
        <input type="hidden" id="paquete-id" />
        <div class="fila">
          <label>Destino
            <input type="text" id="destino" required maxlength="80" placeholder="Ej. Cartagena" />
          </label>
          <label>País
            <input type="text" id="pais" required maxlength="60" placeholder="Ej. Colombia" />
          </label>
        </div>
        <label>Categoría
          <select id="categoria" required></select>
        </label>
        <div class="fila">
          <label>Salida
            <input type="date" id="fechaSalida" required />
          </label>
          <label>Regreso
            <input type="date" id="fechaRegreso" required />
          </label>
        </div>
        <div class="fila">
          <label>Precio por persona
            <span class="con-prefijo"><span aria-hidden="true">US$</span>
              <input type="number" id="precio" required min="1" step="0.01" inputmode="decimal" />
            </span>
          </label>
          <label>Cupos
            <input type="number" id="cupos" required min="0" step="1" inputmode="numeric" />
          </label>
        </div>
        <label><span>Descripción <span class="opcional">· opcional</span></span>
          <textarea id="descripcion" rows="3" maxlength="300" placeholder="Qué incluye, hotel, excursiones…"></textarea>
        </label>
        <p class="error-form" id="error-form" role="alert" hidden></p>
        <button type="submit" id="btn-guardar" class="primario">Crear paquete</button>
      </form>
    </section>

    <section class="panel panel-lista" aria-labelledby="titulo-paquetes">
      <div class="panel-cabecera">
        <h2 id="titulo-paquetes">Paquetes</h2>
        <span class="conteo" id="conteo" aria-live="polite"></span>
      </div>
      <div class="filtros">
        <label class="buscador">
          <span class="sr">Buscar</span>
          <svg class="icono"><use href="#i-search"/></svg>
          <input type="search" id="buscar" placeholder="Buscar destino, país o descripción" />
        </label>
        <label><span class="sr">Categoría</span>
          <select id="filtro-categoria">
            <option value="">Todas las categorías</option>
          </select>
        </label>
        <label><span class="sr">Disponibilidad</span>
          <select id="filtro-disponible">
            <option value="">Disponibilidad</option>
            <option value="true">Con cupos</option>
            <option value="false">Agotados</option>
          </select>
        </label>
      </div>
      <ul id="lista" class="lista" aria-busy="true">
        <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
      </ul>
      <div id="vacio" class="vacio" hidden></div>
    </section>
    </div>

    <section class="panel panel-ancho" aria-labelledby="titulo-reservas">
      <div class="panel-cabecera">
        <h2 id="titulo-reservas">Reservas</h2>
      </div>
      <ul id="lista-reservas" class="reservas"></ul>
      <p id="vacio-reservas" class="vacio" hidden>Todavía no hay reservas. Usá <strong>Reservar</strong> en un paquete con cupos para crear la primera.</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
